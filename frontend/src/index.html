<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlgoRoute</title>
  <!-- Leaflet CSS and app styles are injected by Vite from main.ts imports -->
</head>
<body>
  <div id="panel">
    <div id="panel-header">AlgoRoute</div>

    <hr class="divider" />

    <div class="input-group">
      <label>
        Origin
        <div class="autocomplete-wrapper">
          <input id="origin-input" type="text" placeholder="e.g. Glenhuntly Rd, Elsternwick" autocomplete="off" />
          <ul id="origin-suggestions" class="autocomplete-dropdown"></ul>
        </div>
      </label>
      <label>
        Destination
        <div class="autocomplete-wrapper">
          <input id="destination-input" type="text" placeholder="e.g. Chapel St, South Yarra" autocomplete="off" />
          <ul id="destination-suggestions" class="autocomplete-dropdown"></ul>
        </div>
      </label>
    </div>

    <button id="find-route-button">Find Route</button>

    <hr class="divider" />

    <div class="settings-group">
      <label>
        Algorithm
        <select id="algorithm-select">
          <option value="dijkstra">Dijkstra</option>
          <option value="astar">A*</option>
        </select>
      </label>
      <label id="speed-label">
        Speed
        <select id="speed-select">
          <option value="slow">Slow</option>
          <option value="medium" selected>Medium</option>
          <option value="fast">Fast</option>
        </select>
      </label>
      <label id="map-style-label">
        Map Style
        <select id="map-style-select">
          <option value="standard">Standard</option>
          <option value="dark">Dark</option>
          <option value="voyager">Voyager</option>
          <option value="minimal">Minimal</option>
        </select>
      </label>
    </div>

    <hr class="divider" />

    <div id="status-message"></div>
    <div id="legend">
      <span class="legend-item">
        <span class="legend-swatch" id="legend-visited-swatch"></span>
        <span id="legend-visited-label">Explored nodes</span>
      </span>
      <span class="legend-item">
        <span class="legend-swatch" style="background:#3b82f6;"></span>
        Shortest path
      </span>
    </div>
    <button id="skip-button" title="Skip to final route immediately">Skip animation</button>
    <button id="toggle-visited-button">Show explored nodes</button>
  </div>

  <div id="map"></div>

  <script type="module" src="/main.ts"></script>
</body>
</html>
